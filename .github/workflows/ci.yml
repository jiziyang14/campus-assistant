name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: campus-src
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.18.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: campus-src/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check types
        run: pnpm type

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # 品牌 Logo / 图标不入公开仓库，构建前用占位文件补齐，避免 CI 因缺少私有素材失败
      - name: Stub private brand assets
        run: |
          mkdir -p src/assets
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="#ff6b35"/></svg>' > src/assets/logo-small.svg
          printf '%s\n' '<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32"><rect width="32" height="32" fill="#ff6b35"/></svg>' > src/assets/apple-touch-icon.png
          : > src/assets/favicon.ico

      - name: Build
        run: pnpm build
